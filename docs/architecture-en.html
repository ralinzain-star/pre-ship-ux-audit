  <div style="display:flex; flex-direction:column; gap:8px">

    <h1>Pre-ship UX Audit</h1>

  <div class="figbox">
      <svg viewBox="0 0 900 1630" role="img" aria-label="Architecture of the pre-ship UX audit. Whatever exists goes in: a spec, Figma, the critical user flow, the JTBD, a URL, and the tickets. The first step is naming the stage: spec, static, prototype or build, defined as the earliest point at which absence is trustworthy. A stocktake then asks whether the critical user flow is complete, whether the JTBD are written and whether they carry measurable outcomes. Next, every element of the flow is classified for coverage by comparing the spec against the build: agreed, specified but not built, built but never specified, or absent from both. A dispatch line fans out to seven auditors running at once, each listing its rules with the stage from which each rule can be trusted. They converge into a merge step that groups findings naming the same root cause, then into score_audit.py, which splits its output four ways: two report files counted as distinct root causes, checks the artefact is too early to judge, findings that rest on how the artefact was staged, and observations handed to another owner. Only the first group scores. A dashed loop returns to the dispatch point.">
